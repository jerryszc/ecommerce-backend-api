# Render Blueprint: API + PostgreSQL (free tier, ideal para demo de portafolio).
# Uso: Render Dashboard -> New -> Blueprint -> conectar este repo.
services:
  - type: web
    name: ecommerce-backend-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: ecommerce-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ecommerce-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ecommerce-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ecommerce-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ecommerce-db
          property: password
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: ecommerce-db
    plan: free
