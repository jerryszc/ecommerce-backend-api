[project]
name = "ecommerce-backend-api"
version = "0.1.0"
description = "E-Commerce Inventory and Orders Backend API"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "T20"
]
ignore = ["E501", "B008"]  # line too long (handled by formatter); B008 is standard FastAPI pattern

[tool.ruff.lint.per-file-ignores]
"app/alembic/*" = ["I001", "E402", "W291", "UP035", "UP007"]  # migrations are generated
"tests/*" = ["S101", "T201", "B008"]  # tests can use assert, print, and Depends

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "pydantic.*", "pydantic_settings.*"]
ignore_missing_imports = true

# Alembic migrations are auto-generated; exclude them from strict typing.
[[tool.mypy.overrides]]
module = "app.alembic.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]